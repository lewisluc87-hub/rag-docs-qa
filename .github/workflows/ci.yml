name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Build offline ingest + eval report
        # Runs BEFORE pytest: test_mcp_server.py drives the real MCP
        # server as a subprocess, which needs an already-built Chroma DB
        # (chroma_db/) and get_eval_summary()'s test wants a real
        # eval/eval_report.md to exist, not just the "not generated yet"
        # fallback path.
        run: |
          python ingest.py --dev-tfidf
          python eval/run_eval.py --dev-tfidf
          cat eval/eval_report.md

      - name: Unit + integration tests
        run: pytest -q
